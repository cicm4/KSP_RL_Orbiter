name: Tests and installed wheel

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned development and training dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e '.[train,ksp,dev]'
          python -m pip check
      - name: Unit tests without a running KSP instance
        run: python -m pytest -q
      - name: Build sdist and wheel
        run: python -m build
      - name: Clean wheel install with full extras
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/orbiter-wheel-full"
          "$RUNNER_TEMP/orbiter-wheel-full/bin/python" -m pip install -r requirements.txt
          "$RUNNER_TEMP/orbiter-wheel-full/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/orbiter-wheel-full/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/orbiter-wheel-full/bin/python" -I "$GITHUB_WORKSPACE/tests/wheel_smoke.py" --with-train \
            --model "$GITHUB_WORKSPACE/models/terrier_ppo.zip" \
            --model "$GITHUB_WORKSPACE/models/terrier_aero_ppo.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  core-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel without installing training dependencies
        run: |
          python -m pip install build==1.6.1
          python -m build
      - name: Clean core-only install
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/orbiter-wheel-core"
          "$RUNNER_TEMP/orbiter-wheel-core/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/orbiter-wheel-core/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/orbiter-wheel-core/bin/python" -I "$GITHUB_WORKSPACE/tests/wheel_smoke.py" --core-only
